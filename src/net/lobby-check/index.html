<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modulus — 4-Peer Direct-Only Private Lobby Check</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px/1.45 system-ui, -apple-system, sans-serif;
      background: #0a0c10;
      color: #e2e8f0;
    }
    body { margin: 0 auto; max-width: 960px; padding: 20px; }
    h1 { margin: 0 0 6px; font-size: 20px; color: #38bdf8; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-right: 6px; background: #1e293b; color: #94a3b8; }
    .badge.direct { background: #064e3b; color: #6ee7b7; }
    .badge.unranked { background: #3b0764; color: #e9d5ff; }
    .panel { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 14px; margin-top: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    input, select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; }
    button { background: #0284c7; border-color: #0ea5e9; font-weight: 600; cursor: pointer; }
    button.secondary { background: #1e293b; border-color: #475569; }
    button.danger { background: #991b1b; border-color: #ef4444; }
    pre { background: #030712; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; overflow: auto; max-height: 280px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Modulus — 4-Peer Direct-Only Friend Lobby Check</h1>
  <div>
    <span class="badge direct">TURN DISABLED · STUN ONLY</span>
    <span class="badge unranked">PRIVATE · UNRANKED (NO TIME TRIAL PBs)</span>
    <span class="badge" id="sig-badge">Signaling: PeerJS Cloud</span>
  </div>

  <div class="panel">
    <div class="row">
      <label>Name <input id="name" value="Driver" /></label>
      <label>Signaling
        <select id="signaling">
          <option value="peerjs">PeerJS Cloud (0.peerjs.com)</option>
          <option value="broadcast">Local BroadcastChannel (Offline Regression)</option>
        </select>
      </label>
      <button id="btn-create">Create Private Room</button>
    </div>
    <div class="row">
      <label>Room ID <input id="room-id" size="28" placeholder="room_..." /></label>
      <label>Entry Peer ID <input id="entry-peer" size="26" placeholder="modp_..." /></label>
      <button id="btn-join">Join Room</button>
    </div>
    <div class="row">
      <button id="btn-probe" class="secondary">Probe Links (6-link Mesh)</button>
      <button id="btn-elect" class="secondary">Elect Host &amp; Backup</button>
      <button id="btn-claim" class="secondary">Claim Backup Host</button>
      <button id="btn-drop" class="danger">Simulate Abrupt Drop</button>
      <button id="btn-leave" class="secondary">Leave</button>
    </div>
  </div>

  <div class="panel">
    <strong>Room State</strong>
    <pre id="state-json">{}</pre>
  </div>

  <div class="panel">
    <strong>Logs</strong>
    <pre id="logs"></pre>
  </div>

  <script type="module" src="./lobbyCheckApp.ts"></script>
</body>
</html>
